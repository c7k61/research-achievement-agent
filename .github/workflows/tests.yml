name: Python tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install document parsers and CLI
        run: python -m pip install '.[documents]'
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Run offline demo
        run: python demo.py
      - name: Verify installed entry point
        run: research-agent --help
