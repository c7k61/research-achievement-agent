[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "research-achievement-agent"
version = "0.2.0"
description = "Evidence retrieval and tool-calling Agent for research achievement notices"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
documents = ["pypdf>=6,<7", "python-docx>=1.2,<2"]

[project.scripts]
research-agent = "research_agent.__main__:main"

[tool.setuptools.packages.find]
include = ["research_agent*"]
